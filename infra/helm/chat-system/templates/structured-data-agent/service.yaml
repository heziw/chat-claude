apiVersion: v1
kind: Service
metadata:
  name: structured-data-agent
  labels:
    {{- include "chat-system.componentLabels" (dict "component" "structured-data-agent" "ctx" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "chat-system.selectorLabels" (dict "component" "structured-data-agent" "ctx" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.structuredDataAgent.port }}
      targetPort: {{ .Values.structuredDataAgent.port }}
