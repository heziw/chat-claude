apiVersion: v1
kind: Service
metadata:
  name: summarization-service
  labels:
    {{- include "chat-system.componentLabels" (dict "component" "summarization-service" "ctx" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "chat-system.selectorLabels" (dict "component" "summarization-service" "ctx" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.summarizationService.port }}
      targetPort: {{ .Values.summarizationService.port }}
