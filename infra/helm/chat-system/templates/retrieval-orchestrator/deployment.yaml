apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-orchestrator
  labels:
    {{- include "chat-system.componentLabels" (dict "component" "retrieval-orchestrator" "ctx" $) | nindent 4 }}
spec:
  {{- if not .Values.retrievalOrchestrator.hpa.enabled }}
  replicas: {{ .Values.retrievalOrchestrator.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chat-system.selectorLabels" (dict "component" "retrieval-orchestrator" "ctx" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chat-system.selectorLabels" (dict "component" "retrieval-orchestrator" "ctx" $) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: retrieval-orchestrator
          image: {{ include "chat-system.image" (dict "repository" .Values.retrievalOrchestrator.image.repository "tag" .Values.retrievalOrchestrator.image.tag "ctx" $) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.retrievalOrchestrator.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-shared-env
            - secretRef:
                name: {{ .Release.Name }}-shared-secret
          env:
            {{- range $k, $v := .Values.retrievalOrchestrator.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.retrievalOrchestrator.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
