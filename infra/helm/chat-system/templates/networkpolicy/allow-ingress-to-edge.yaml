{{- if .Values.networkPolicies.enabled }}
# Only the two edge-facing components get traffic from outside the
# namespace: gateway (API, behind Ingress) and client (the Angular static
# bundle the browser loads directly, also behind its own Ingress host). All
# Python services / vLLM model servers / MSSQL / Redis / Milvus rely
# solely on allow-intra-namespace.yaml and are otherwise unreachable from
# outside this namespace — matching the plan's "only gateway is exposed"
# requirement at the backend-API level.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-edge
  labels:
    {{- include "chat-system.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - gateway
          - client
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicies.ingressControllerNamespaceSelector.key }}: {{ .Values.networkPolicies.ingressControllerNamespaceSelector.value | quote }}
{{- end }}
