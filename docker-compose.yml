services:
  # Local dev stand-in only -- production points MSSQL_* at the existing
  # enterprise SQL Server instead (see shared/CONTRACTS.md). No Helm
  # manifest deploys this in production.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ChatApp!Dev123"
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the chatdb database + schema, then exits. Re-running
  # docker compose up is idempotent (mssql-init.sql uses IF NOT EXISTS).
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./infra/docker/mssql-init.sql:/init/mssql-init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd; [ -x "$$SQLCMD" ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd;
        $$SQLCMD -C -S mssql -U sa -P "ChatApp!Dev123" -Q "IF DB_ID('chatdb') IS NULL CREATE DATABASE chatdb" &&
        $$SQLCMD -C -S mssql -U sa -P "ChatApp!Dev123" -d chatdb -i /init/mssql-init.sql
    restart: "no"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcddata:/etcd

  minio:
    image: localstack/localstack:3.0
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports: ["4566:4566"]
    volumes:
      - miniodata:/var/lib/localstack

  milvus:
    image: milvusdb/milvus:v2.4.9
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:4566
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_USE_SSL: "false"
    ports: ["19530:19530", "9091:9091"]
    depends_on: [etcd, minio]
    volumes:
      - milvusdata:/var/lib/milvus

volumes:
  mssqldata:
  etcddata:
  miniodata:
  milvusdata:
