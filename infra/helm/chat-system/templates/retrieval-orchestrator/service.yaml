apiVersion: v1
kind: Service
metadata:
  name: retrieval-orchestrator
  labels:
    {{- include "chat-system.componentLabels" (dict "component" "retrieval-orchestrator" "ctx" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "chat-system.selectorLabels" (dict "component" "retrieval-orchestrator" "ctx" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.retrievalOrchestrator.port }}
      targetPort: {{ .Values.retrievalOrchestrator.port }}
