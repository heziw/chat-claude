# Secret-grade shared env vars (connection strings with credentials, signing
# secrets, OIDC client secret). Dev defaults live in values.yaml for local
# convenience; real environments MUST override `global.secretEnv.*` from an
# external secret source (sealed-secrets/SOPS/Vault injector/CI secret store)
# instead of committing real values into any values-*.yaml file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-shared-secret
  labels:
    {{- include "chat-system.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.global.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
