{{- if .Values.milvus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: milvus-etcd
  labels:
    {{- include "chat-system.componentLabels" (dict "component" "milvus-etcd" "ctx" $) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "chat-system.selectorLabels" (dict "component" "milvus-etcd" "ctx" $) | nindent 4 }}
  ports:
    - name: client
      port: 2379
      targetPort: 2379
{{- end }}
