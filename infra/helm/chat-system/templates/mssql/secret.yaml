{{- if .Values.mssql.enabled }}
# Local MSSQL's own SA password (dev/test default). Separate from
# global.secretEnv.MSSQL_PASSWORD (what every app service reads) so the two
# can be rotated/overridden independently.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mssql-local
  labels:
    {{- include "chat-system.componentLabels" (dict "component" "mssql" "ctx" $) | nindent 4 }}
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: {{ .Values.mssql.password | quote }}
{{- end }}
