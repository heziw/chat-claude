apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "chat-system.componentLabels" (dict "component" "gateway" "ctx" $) | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "chat-system.selectorLabels" (dict "component" "gateway" "ctx" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
