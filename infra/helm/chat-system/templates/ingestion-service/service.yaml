apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  labels:
    {{- include "chat-system.componentLabels" (dict "component" "ingestion-service" "ctx" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "chat-system.selectorLabels" (dict "component" "ingestion-service" "ctx" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ingestionService.port }}
      targetPort: {{ .Values.ingestionService.port }}
