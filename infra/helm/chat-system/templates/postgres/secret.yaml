{{- if .Values.postgres.enabled }}
# Local Postgres's own superuser password (dev/test default). This is
# separate from global.secretEnv.POSTGRES_URL (which is the DSN every app
# service reads) so the two can be rotated/overridden independently.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-local
  labels:
    {{- include "chat-system.componentLabels" (dict "component" "postgres" "ctx" $) | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}
