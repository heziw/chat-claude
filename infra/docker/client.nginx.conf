# SPA fallback: deep-linked Angular routes (e.g. /conversations/<id>) must
# resolve to index.html, not a 404, so the client-side router can take over.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
